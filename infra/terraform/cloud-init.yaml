#cloud-config
# Bootstraps the 1 GB Lightsail instance: installs Docker + the Compose plugin,
# adds a swap file (essential headroom on a 1 GB box), and prepares /opt/app
# where the deploy workflow drops docker-compose.yml, Caddyfile and .env.
package_update: true
package_upgrade: false

write_files:
  - path: /etc/sysctl.d/99-swappiness.conf
    content: |
      vm.swappiness=10

runcmd:
  # --- 2 GB swap file (1 GB RAM needs headroom for image pulls + .NET) ---
  - test -f /swapfile || fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system

  # --- Docker Engine + Compose plugin (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # --- Deployment directory ---
  - mkdir -p /opt/app
  - chown ubuntu:ubuntu /opt/app
