name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-audit:
    name: Secret & Config Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "ERROR: .env files must not be committed to source control."
            exit 1
          fi
          echo "PASS: No .env files found in tracked files."

      - name: Verify no hardcoded secrets in source
        run: |
          PATTERNS=(
            'ConnectionStrings__Default\s*=\s*Host='
            'Auth__Google__ClientSecret\s*=\s*[^<]'
            'Jwt__SigningKey\s*=\s*[^<]'
            'AWS__SecretAccessKey\s*=\s*[^<]'
            'AWS__AccessKeyId\s*=\s*[A-Z0-9]{16}'
          )
          FAILED=0
          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn --include='*.cs' --include='*.json' --include='*.ts' --include='*.tsx' \
              --exclude-dir=node_modules --exclude-dir=obj --exclude-dir=bin \
              -E "$PATTERN" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "ERROR: Possible hardcoded secret found:"
              echo "$MATCHES"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "PASS: No hardcoded secrets detected."

      - name: Verify .env.example placeholders only
        run: |
          REAL_VALUE_PATTERN='=\S{8,}[^>]'
          FAILED=0
          for EXAMPLE_FILE in $(git ls-files | grep '\.env\.example$'); do
            # Skip lines that are comments or empty
            while IFS= read -r LINE; do
              [[ "$LINE" =~ ^#.*$ || -z "$LINE" ]] && continue
              VALUE=$(echo "$LINE" | cut -d= -f2-)
              # Values that look like real secrets: long non-placeholder strings not matching <...> patterns
              if echo "$VALUE" | grep -qE '^[A-Za-z0-9+/]{20,}={0,2}$'; then
                echo "WARNING: $EXAMPLE_FILE may contain a real secret value: $LINE"
                FAILED=1
              fi
            done < "$EXAMPLE_FILE"
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "PASS: .env.example files contain placeholders only."

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: secret-audit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: virtual_wardrobe_test
          POSTGRES_USER: vw_test
          POSTGRES_PASSWORD: vw_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=virtual_wardrobe_test;Username=vw_test;Password=vw_test_pass"
      Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY_TEST }}
      Jwt__Issuer: virtual-wardrobe-test
      Jwt__Audience: virtual-wardrobe-test
      Auth__Google__ClientId: test-client-id
      AWS__Region: us-east-1
      AWS__S3__BucketName: test-bucket
      AWS__AccessKeyId: test-key
      AWS__SecretAccessKey: test-secret
      Cors__AllowedOrigins__0: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        working-directory: backend
        run: dotnet test tests/VirtualWardrobe.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx"

      - name: Run integration tests
        working-directory: backend
        run: dotnet test tests/VirtualWardrobe.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"

      - name: Run contract tests
        working-directory: backend
        run: dotnet test tests/VirtualWardrobe.ContractTests --no-build --configuration Release --logger "trx;LogFileName=contract-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/**/*.trx

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: secret-audit
    env:
      VITE_API_BASE_URL: http://127.0.0.1:9323
      VITE_GOOGLE_CLIENT_ID: test-client-id
      VITE_DEFAULT_LOCALE: pt-BR
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Unit tests
        working-directory: frontend
        run: npm test --if-present -- --run

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build for e2e
        working-directory: frontend
        run: npm run build

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
